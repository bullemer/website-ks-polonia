name: Deploy to Hetzner Webspace

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Website
        run: npm run build
        env:
          VITE_KEYSTATIC_GITHUB_CLIENT_ID: Ov23livPaxPzjXA7k7vR

      # ═══════════════════════════════════════
      #  SSH Setup (same pattern as navisense)
      # ═══════════════════════════════════════
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Known Hosts
        run: |
          ssh-keyscan -p 222 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ═══════════════════════════════════════
      #  Deploy Frontend (Astro dist/)
      # ═══════════════════════════════════════
      - name: Deploy Frontend via rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST=$(echo "$SSH_HOST" | xargs)
          USER=$(echo "$SSH_USER" | xargs)
          echo "Deploying frontend to $USER@$HOST"
          rsync -avz --delete \
            --exclude='.htaccess' \
            -e "ssh -p 222" \
            dist/ "$USER@$HOST:/usr/home/trusteei/public_html/ks-polonia/"

      # ═══════════════════════════════════════
      #  Deploy Backend (FastAPI)
      # ═══════════════════════════════════════
      - name: Deploy Backend via rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST=$(echo "$SSH_HOST" | xargs)
          USER=$(echo "$SSH_USER" | xargs)
          echo "Deploying backend to $USER@$HOST"
          rsync -avz --delete \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            -e "ssh -p 222" \
            backend/ "$USER@$HOST:/usr/home/trusteei/flaskprojects/kspolonia/backend/"

      # ═══════════════════════════════════════
      #  Post-Deploy: Install Python deps
      # ═══════════════════════════════════════
      - name: Install Python Dependencies on Server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST=$(echo "$SSH_HOST" | xargs)
          USER=$(echo "$SSH_USER" | xargs)
          ssh -p 222 "$USER@$HOST" << 'ENDSSH'
            source /usr/home/trusteei/virtualenvs/kspolonia/bin/activate
            cd /usr/home/trusteei/flaskprojects/kspolonia/backend
            pip install -r requirements.txt 2>&1 | tail -5
            echo "Python deps installed OK"
          ENDSSH

      # ═══════════════════════════════════════
      #  Post-Deploy: Run DB Migration (safe)
      #  Uses Python asyncpg — no psql needed
      # ═══════════════════════════════════════
      - name: Run Database Migration
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST=$(echo "$SSH_HOST" | xargs)
          USER=$(echo "$SSH_USER" | xargs)
          ssh -p 222 "$USER@$HOST" << 'ENDSSH'
            source /usr/home/trusteei/virtualenvs/kspolonia/bin/activate
            cd /usr/home/trusteei/flaskprojects/kspolonia/backend
            python3 migrate.py 2>&1 | tail -30
            echo "Migration step complete"
          ENDSSH

      # ═══════════════════════════════════════
      #  Restart FCGI to load new code
      # ═══════════════════════════════════════
      - name: Restart FCGI Process
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST=$(echo "$SSH_HOST" | xargs)
          USER=$(echo "$SSH_USER" | xargs)
          ssh -p 222 "$USER@$HOST" "touch /usr/home/trusteei/public_html/ks-polonia/api/api.fcgi && echo 'FCGI restarted'"
