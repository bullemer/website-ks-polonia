<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#DC143C">
    <title>Dauerkarte Login – KS Polonia Hamburg</title>
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--p:#DC143C;--pd:#a50e2d;--bg:#fafafa;--s:#fff;--b:#e5e7eb;--t:#111827;--tm:#6b7280;--r:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
        .hero{background:linear-gradient(145deg,#DC143C 0%,#8B0000 60%,#6d0020 100%);color:#fff;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.5rem 3rem;position:relative;overflow:hidden}
        .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.08) 0%,transparent 60%)}
        .hero-logo{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.3);margin:0 auto 1rem;box-shadow:0 8px 32px rgba(0,0,0,.2)}
        .hero h1{font-size:1.3rem;font-weight:800}.hero p{font-size:.88rem;opacity:.8;margin-top:.3rem}
        .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem}
        .card{width:100%;max-width:400px;background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:2rem 1.5rem;box-shadow:0 4px 24px rgba(0,0,0,.04);margin-top:-1.5rem;position:relative;z-index:1}
        .field{margin-bottom:1.25rem}
        .field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--tm);text-transform:uppercase;letter-spacing:.04em}
        .field input{width:100%;padding:.85rem 1rem;border:1.5px solid var(--b);border-radius:10px;font-size:1rem;font-family:inherit;transition:border-color .2s}
        .field input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(220,20,60,.1)}
        .btn{width:100%;padding:.9rem;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
        .btn:hover{background:var(--pd)}.btn:disabled{background:var(--b);color:var(--tm);cursor:not-allowed}
        .links{text-align:center;margin-top:1.25rem;display:flex;flex-direction:column;gap:.75rem}
        .links a{font-size:.88rem;color:var(--tm);text-decoration:none}.links a:hover{color:var(--p)}
        .links .signup-link{font-weight:600;color:var(--p);padding:.7rem 1rem;border:1.5px solid var(--p);border-radius:10px;transition:all .2s}
        .links .signup-link:hover{background:var(--p);color:#fff}
        .alert{padding:.8rem 1rem;border-radius:10px;font-size:.88rem;font-weight:500;margin-bottom:1.25rem;display:none}
        .alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
        .alert-success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
        .divider{display:flex;align-items:center;gap:1rem;margin:1.25rem 0;color:var(--tm);font-size:.8rem}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b)}
        .footer{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--tm)}.footer a{color:var(--tm)}
    </style>
</head>
<body>
    <div class="hero">
        <img src="/logo.png" alt="KS Polonia" class="hero-logo">
        <h1>Dauerkarte</h1>
        <p>Anmelden & Ticket anzeigen</p>
    </div>
    <div class="main">
        <div class="card">
            <div id="alert" class="alert"></div>
            <form id="loginForm">
                <div class="field">
                    <label for="email">E-Mail-Adresse</label>
                    <input type="email" id="email" required placeholder="max@example.de" autocomplete="email" inputmode="email">
                </div>
                <div class="field">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="submitBtn">Anmelden</button>
            </form>
            <div class="links">
                <div class="divider">oder</div>
                <a href="/api/tickets/signup" class="signup-link">Dauerkarte beantragen →</a>
            </div>
        </div>
    </div>
    <div class="footer"><a href="/">← Zurück zur Website</a> · © KS Polonia Hamburg e.V. 1988</div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('alert');
            btn.disabled = true; btn.textContent = 'Anmelden...'; alert.style.display = 'none';
            try {
                const res = await fetch('/api/tickets/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await res.json();
                if (res.ok && data.success) { window.location.href = '/api/tickets/my'; }
                else { alert.textContent = data.detail || 'Anmeldung fehlgeschlagen'; alert.className = 'alert alert-error'; alert.style.display = 'block'; }
            } catch (err) { alert.textContent = 'Verbindungsfehler'; alert.className = 'alert alert-error'; alert.style.display = 'block'; }
            finally { btn.disabled = false; btn.textContent = 'Anmelden'; }
        });
    </script>
</body>
</html>
